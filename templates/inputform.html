	<body>

		
		<!-- top-area Start -->
		<header class="top-area">
			<div class="header-area">
				<!-- Start Navigation -->
			    <nav class="navbar navbar-default bootsnav navbar-fixed dark no-background">

			        <div class="container">

			            <!-- Start Header Navigation -->

		<div class="section-heading text-left" style="margin-left: 15%; margin-top: 180px;">
			<h2>Input Fileds</h2>
		</div>
		<!-- Form Table -->
		<div class="form-container">
		<form class="form-grid" method="post">
			<!-- First Column: Soil Nutrition -->
			<div class="form-column">
			<h3>Soil Nutrition</h3>
			<div class="form-row">
				<input type="text" id="NitrogenInp" name="NitrogenInp" placeholder="Nitrogen(N)" required="required" pattern="\d+(\.\d+)?" title="Please enter a numeric value">
			</div>
			<div class="form-row">
				<input type="text" id="PotassiumInp" name="PotassiumInp" placeholder="Potassium(K)" required="required" pattern="\d+(\.\d+)?" title="Please enter a numeric value">
			</div>
			<div class="form-row">
				<input type="text" id="PhosphorusInp" name="PhosphorusInp" placeholder="Phosphorus(P)" required="required" pattern="\d+(\.\d+)?" title="Please enter a numeric value">
			</div>
			</div>
			
			<!-- Second Column: Weather Condition -->
			<div class="form-column">
			<h3>Weather Condition</h3>
			<div class="form-row">
				<input type="text" id="TemperatureInp" name="TemperatureInp" placeholder="Temperature" required="required" pattern="\d+(\.\d+)?" title="Please enter a numeric value">
			</div>
			<div class="form-row">
				<input type="text" id="RainfallInp" name="RainfallInp" placeholder="Rainfall" required="required" pattern="\d+(\.\d+)?" title="Please enter a numeric value">
			</div>
			<div class="form-row">
				<input type="text" id="HumidityInp" name="HumidityInp" placeholder="Humidity" required="required" pattern="\d+(\.\d+)?" title="Please enter a numeric value">
			</div>
			</div>
					
			<!-- Third Column: Soil Type (Drop-down) -->
			<div class="form-column">
			<h3>Soil Ph</h3>
			<div class="form-row">
				<input type="text" id="PhInp" name="PhInp" placeholder="Ph Level" required="required" pattern="\d+(\.\d+)?" title="Please enter a numeric value">
			</div>
			</div>

			<!-- Submit Button -->
			<div class="form-row submit-button">
			<button type="submit">Submit</button>
			</div>
		</form>
		</div>
