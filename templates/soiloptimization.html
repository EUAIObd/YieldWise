		<section id="cropguide" class="education" style="margin-top: 7em;">
		<div class="section-heading text-left" style="margin-left: 15%;">
			<h2 class="headL">Customize your Crop</h2>
		</div>
		<hr class="black">
		<div class="container">
			<p class="explanation">This is a brief explanation of why they are number one.</p>
			<br>
			<form>
				<label for="cropSelect">Select the crop you would like to plant:</label>
				<select id="cropSelect" name="crop">
				{% for crop in crops %}
					<option value="{{ crop[1] }}">{{ crop[1] }}</option>
				{% endfor %}
				</select>
				<br>
				<input type="submit" value="Submit">
			</form>
