		<div class="section-heading text-left" style="margin-left: 15%; margin-top: 180px;">
			<h2>Input Fileds</h2>
		</div>
		<!-- Form Table -->
		<div class="form-container">
		<form class="form-grid" action="{{ url_for('cropguide') }}">
			<!-- First Column: Soil Nutrition -->
			<div class="form-column">
			<h3>Soil Nutrition</h3>
			<div class="form-row">
				<input type="text" id="NitrogenInp" name="NitrogenInp" placeholder="Nitrogen(N)">
			</div>
			<div class="form-row">
				<input type="text" id="PotassiumInp" name="PotassiumInp" placeholder="Potassium(K)">
			</div>
			<div class="form-row">
				<input type="text" id="PhosphorusInp" name="PhosphorusInp" placeholder="Phosphorus(P)">
			</div>
			</div>
			
			<!-- Second Column: Weather Condition -->
			<div class="form-column">
			<h3>Weather Condition</h3>
			<div class="form-row">
				<input type="text" id="TemperatureInp" name="TemperatureInp" placeholder="Temperature">
			</div>
			<div class="form-row">
				<input type="text" id="RainfallInp" name="RainfallInp" placeholder="Rainfall">
			</div>
			<div class="form-row">
				<input type="text" id="HumidityInp" name="HumidityInp" placeholder="Humidity">
			</div>
			</div>
					
			<!-- Third Column: Soil Type (Drop-down) -->
			<div class="form-column">
			<h3>Soil Type</h3>
			<div class="form-row">
				<select id="soil-type" name="soil-type">
				<option value="clay">Clay</option>
				<option value="loamy">Loamy</option>
				<option value="sandy">Sandy</option>
				</select>
			</div>
			</div>

			<!-- Submit Button -->
			<div class="form-row submit-button">
			<button type="submit">Submit</button>
			</div>
		</form>
